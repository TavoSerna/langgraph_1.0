readme = "README.md"
authors = [
    { name = "GustavoSerna", email = "gustavoluisserna@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "ddgs>=9.16.1",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
